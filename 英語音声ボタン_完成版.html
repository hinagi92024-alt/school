<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英語 音声ボタン</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  header h1 .en { color: var(--muted); font-weight: 600; font-size: 14px; margin-left: 6px; }
  .icon-btn {
    border: none; background: #eef2ff; color: var(--accent);
    width: 46px; height: 46px; border-radius: 12px;
    font-size: 22px; cursor: pointer;
  }
  .icon-btn:active { background: #e0e7ff; }

  /* ボタングリッド */
  main { padding: 6px 18px 28px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
    max-width: 900px; margin: 0 auto;
  }
  .sound-btn {
    position: relative;
    border: none; border-radius: 22px;
    min-height: 150px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    color: #fff; cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,.10);
    transition: transform .08s ease;
    padding: 16px;
    overflow: hidden;
  }
  .sound-btn:active { transform: scale(.97); }
  .sound-btn .num { font-size: 56px; font-weight: 800; line-height: 1; }
  .sound-btn .label { font-size: 20px; font-weight: 700; text-align: center; word-break: break-word; }
  .sound-btn.empty { background: #e5e7eb !important; color: #9ca3af; box-shadow: none; }
  .sound-btn.empty .hint { font-size: 14px; font-weight: 600; }
  .sound-btn.playing { outline: 4px solid rgba(255,255,255,.9); }
  .sound-btn .bar {
    position: absolute; left: 0; bottom: 0; height: 6px; width: 0%;
    background: rgba(255,255,255,.85);
  }
  /* 色 */
  .c1 { background: #ef4444; } .c2 { background: #f59e0b; }
  .c3 { background: #10b981; } .c4 { background: #3b82f6; }
  .c5 { background: #8b5cf6; } .c6 { background: #ec4899; }

  /* 設定パネル */
  .overlay {
    position: fixed; inset: 0; background: rgba(17,24,39,.45);
    display: none; align-items: flex-start; justify-content: center;
    padding: 20px; overflow-y: auto; z-index: 50;
  }
  .overlay.show { display: flex; }
  .panel {
    background: var(--card); border-radius: 18px; width: 100%; max-width: 640px;
    padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .panel h2 { margin: 0 0 4px; font-size: 20px; }
  .panel p.desc { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-top: 1px solid var(--line);
  }
  .row .badge {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px;
    color: #fff; font-weight: 800; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .row .fields { flex: 1 1 auto; min-width: 0; }
  .row .fields input[type=text] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 15px; margin-bottom: 6px;
  }
  .row .filename { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .actions { flex: 0 0 auto; display: flex; gap: 6px; }
  .mini {
    border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 8px 10px; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .mini:active { background: #f3f4f6; }
  .mini.play { color: var(--accent); }
  .mini.clear { color: #ef4444; }
  .panel .footer {
    display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px;
    border-top: 1px solid var(--line); padding-top: 16px;
  }
  .btn {
    border: none; border-radius: 10px; padding: 12px 16px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: #f3f4f6; color: var(--text); }
  .btn.wide { flex: 1 1 auto; }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
  .hidden { display: none !important; }
  #unlockDot {
    position: fixed; left: 0; top: 0; width: 46px; height: 46px; z-index: 40;
  }
</style>
</head>
<body>

<header>
  <h1>英語 音声ボタン <span class="en">Tap to listen</span></h1>
  <button class="icon-btn" id="gearBtn" title="設定">⚙</button>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<!-- 授業モード時に設定へ戻るための隠しエリア（左上を3回タップ） -->
<div id="unlockDot"></div>

<!-- 設定パネル -->
<div class="overlay" id="overlay">
  <div class="panel">
    <h2>設定</h2>
    <p class="desc">各ボタンに音声ファイルを割り当てます。ラベル(表示する言葉)は空でもOKです。</p>
    <div id="rows"></div>

    <div class="footer">
      <button class="btn ghost wide" id="lockBtn">🔒 授業モードにする（設定を隠す）</button>
      <button class="btn primary wide" id="closeBtn">閉じる</button>
    </div>
    <div class="footer">
      <button class="btn ghost wide" id="exportBtn">💾 完成版HTMLを書き出す</button>
    </div>
    <p class="note">
      ・音声は短いクリップ推奨です。設定はこのiPadに保存され、次に開いても残ります。<br>
      ・「完成版HTMLを書き出す」を押すと、音声を埋め込んだ<strong>設定不要のファイル</strong>を保存できます。他のiPadに渡すときや、設定を消したくないときに使ってください。<br>
      ・授業モード中に設定へ戻るには、画面の<strong>左上のすみを3回タップ</strong>してください。
    </p>
  </div>
</div>

<script>
(function () {
  "use strict";

  var COUNT = 6;
  var STORAGE_KEY = "eigo-sound-buttons-v1";
  var colors = ["c1", "c2", "c3", "c4", "c5", "c6"];

  // データ: [{label, audio(dataURI or "")}]
  var items = load();

  var player = new Audio();
  var playingIndex = -1;

  var gridEl = document.getElementById("grid");
  var rowsEl = document.getElementById("rows");
  var overlay = document.getElementById("overlay");

  function blankItems() {
    var a = [];
    for (var i = 0; i < COUNT; i++) a.push({ label: "", audio: "" });
    return a;
  }

  function load() {
    // 保存済み → 焼き込みデータ → 空 の優先で読み込む
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.length === COUNT) return parsed;
      }
    } catch (e) {}
    if (window.__BAKED_DATA__ && window.__BAKED_DATA__.length === COUNT) {
      return JSON.parse(JSON.stringify(window.__BAKED_DATA__));
    }
    return blankItems();
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    } catch (e) {
      alert("保存できませんでした。音声のサイズが大きすぎる可能性があります。\n短いクリップを使うか、「完成版HTMLを書き出す」で保存してください。");
    }
  }

  // ---- 生徒用ボタンの描画 ----
  function renderGrid() {
    gridEl.innerHTML = "";
    for (var i = 0; i < COUNT; i++) {
      (function (i) {
        var it = items[i];
        var btn = document.createElement("button");
        btn.className = "sound-btn " + colors[i] + (it.audio ? "" : " empty");

        var num = document.createElement("div");
        num.className = "num";
        num.textContent = (i + 1);
        btn.appendChild(num);

        if (it.audio) {
          if (it.label) {
            var lab = document.createElement("div");
            lab.className = "label";
            lab.textContent = it.label;
            btn.appendChild(lab);
          }
          var bar = document.createElement("div");
          bar.className = "bar";
          btn.appendChild(bar);
        } else {
          var hint = document.createElement("div");
          hint.className = "hint";
          hint.textContent = "（音声なし）";
          btn.appendChild(hint);
        }

        btn.addEventListener("click", function () {
          if (!it.audio) { openPanel(); return; }
          playIndex(i, btn);
        });
        gridEl.appendChild(btn);
      })(i);
    }
  }

  function clearPlayingStyles() {
    var els = gridEl.querySelectorAll(".sound-btn");
    for (var k = 0; k < els.length; k++) {
      els[k].classList.remove("playing");
      var b = els[k].querySelector(".bar");
      if (b) b.style.width = "0%";
    }
  }

  function playIndex(i, btn) {
    // 同じボタンをもう一度押したら停止
    if (playingIndex === i && !player.paused) {
      player.pause();
      player.currentTime = 0;
      clearPlayingStyles();
      playingIndex = -1;
      return;
    }
    clearPlayingStyles();
    playingIndex = i;
    player.src = items[i].audio;
    player.currentTime = 0;
    var p = player.play();
    if (p && p.catch) p.catch(function () {});
    btn.classList.add("playing");
  }

  player.addEventListener("timeupdate", function () {
    if (playingIndex < 0 || !player.duration) return;
    var btn = gridEl.querySelectorAll(".sound-btn")[playingIndex];
    if (!btn) return;
    var bar = btn.querySelector(".bar");
    if (bar) bar.style.width = (player.currentTime / player.duration * 100) + "%";
  });
  player.addEventListener("ended", function () {
    clearPlayingStyles();
    playingIndex = -1;
  });

  // ---- 設定パネルの描画 ----
  function renderRows() {
    rowsEl.innerHTML = "";
    for (var i = 0; i < COUNT; i++) {
      (function (i) {
        var it = items[i];
        var row = document.createElement("div");
        row.className = "row";

        var badge = document.createElement("div");
        badge.className = "badge " + colors[i];
        badge.textContent = (i + 1);
        row.appendChild(badge);

        var fields = document.createElement("div");
        fields.className = "fields";

        var label = document.createElement("input");
        label.type = "text";
        label.placeholder = "ラベル（例: apple / Hello）";
        label.value = it.label || "";
        label.addEventListener("input", function () {
          items[i].label = label.value;
          save();
        });
        fields.appendChild(label);

        var fname = document.createElement("div");
        fname.className = "filename";
        fname.textContent = it.audio ? "音声: 設定済み" : "音声: 未設定";
        fields.appendChild(fname);
        row.appendChild(fields);

        var actions = document.createElement("div");
        actions.className = "actions";

        var fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.accept = "audio/*";
        fileInput.style.display = "none";
        fileInput.addEventListener("change", function () {
          var f = fileInput.files && fileInput.files[0];
          if (!f) return;
          var reader = new FileReader();
          reader.onload = function () {
            items[i].audio = reader.result;
            save();
            fname.textContent = "音声: 設定済み（" + f.name + "）";
            renderGrid();
          };
          reader.readAsDataURL(f);
        });

        var pick = document.createElement("button");
        pick.className = "mini";
        pick.textContent = it.audio ? "変更" : "音声を選ぶ";
        pick.addEventListener("click", function () { fileInput.click(); });

        var prev = document.createElement("button");
        prev.className = "mini play";
        prev.textContent = "▶";
        prev.addEventListener("click", function () {
          if (!items[i].audio) { alert("先に音声を選んでください。"); return; }
          var a = new Audio(items[i].audio);
          a.play();
        });

        var clr = document.createElement("button");
        clr.className = "mini clear";
        clr.textContent = "✕";
        clr.addEventListener("click", function () {
          items[i].audio = "";
          save();
          fname.textContent = "音声: 未設定";
          pick.textContent = "音声を選ぶ";
          renderGrid();
        });

        actions.appendChild(pick);
        actions.appendChild(prev);
        actions.appendChild(clr);
        row.appendChild(actions);
        row.appendChild(fileInput);

        rowsEl.appendChild(row);
      })(i);
    }
  }

  // ---- パネル開閉 / ロック ----
  function openPanel() { renderRows(); overlay.classList.add("show"); }
  function closePanel() { overlay.classList.remove("show"); }

  document.getElementById("gearBtn").addEventListener("click", openPanel);
  document.getElementById("closeBtn").addEventListener("click", closePanel);

  document.getElementById("lockBtn").addEventListener("click", function () {
    document.getElementById("gearBtn").classList.add("hidden");
    closePanel();
  });

  // 授業モード中の復帰: 左上を3回タップ
  var tapCount = 0, tapTimer = null;
  document.getElementById("unlockDot").addEventListener("click", function () {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(function () { tapCount = 0; }, 1200);
    if (tapCount >= 3) {
      tapCount = 0;
      document.getElementById("gearBtn").classList.remove("hidden");
      openPanel();
    }
  });

  // ---- 完成版HTMLの書き出し（音声を焼き込む） ----
  document.getElementById("exportBtn").addEventListener("click", function () {
    // 書き出し用にDOMを初期状態へ正規化（設定画面などが焼き込まれないように）
    overlay.classList.remove("show");
    gridEl.innerHTML = "";
    rowsEl.innerHTML = "";
    var gearWasHidden = document.getElementById("gearBtn").classList.contains("hidden");
    document.getElementById("gearBtn").classList.remove("hidden");

    var data = JSON.stringify(items).replace(/</g, "\\u003c");
    var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    html = html.replace(
      "window.__BAKED_DATA__ = null;",
      "window.__BAKED_DATA__ = " + data + ";"
    );

    // 画面を元に戻す
    renderGrid();
    renderRows();
    overlay.classList.add("show");
    if (gearWasHidden) document.getElementById("gearBtn").classList.add("hidden");

    var blob = new Blob([html], { type: "text/html" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "英語音声ボタン_完成版.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  });

  // ---- 起動 ----
  overlay.classList.remove("show"); // 必ずボタン画面から始める（設定画面で固まらないように）
  renderGrid();
})();
</script>


</body></html>
